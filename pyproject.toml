[project]
name = "tuidash"
version = "0.1.0"
description = "Personal terminal dashboard"
requires-python = ">=3.13"
dependencies = [
    "pillow>=11.0.0",
    "python-dotenv>=1.2.2",
    "requests>=2.33.1",
    "textual>=8.2.5",
    "textual-dev>=1.7.0",
]

[project.scripts]
tuidash = "tuidash.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
