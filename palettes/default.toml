# tuidash colour palette — default (btop-inspired neon teal)
# ──────────────────────────────────────────────────────────
# Values are either hex colours (#rrggbb) or Rich colour names
# (e.g. bright_green, cyan, red, bold red, …).
#
# Select this palette with:  TUIDASH_PALETTE=default  (or leave unset)
# Drop your own .toml here and point TUIDASH_PALETTE at its filename stem.

# ── Core palette ─────────────────────────────────────────────────────────────
primary = "#00d4aa"   # neon mint  — border titles, clock, nav arrows, accents
border  = "#005f4e"   # dark teal  — widget / button borders
bg      = "#0d2018"   # very dark teal — header & footer background

# ── Progress bar gradient (left → right as bar fills) ────────────────────────
bar_low  = "bright_green"  # 0 – 60 % of bar width
bar_mid  = "yellow"        # 60 – 80 % of bar width
bar_high = "bright_red"    # 80 – 100 % of bar width

# ── Performance heatmap (Ghostfolio stat cells) ───────────────────────────────
perf_great    = "bright_green"  # > +10 %
perf_good     = "green"         #   0 to +10 %
perf_flat     = "cyan"          #  −5 to   0 %
perf_bad      = "yellow"        # −10 to  −5 %
perf_poor     = "red"           # −20 to −10 %
perf_terrible = "bright_red"    # < −20 %
